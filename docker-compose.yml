services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 3s
    networks:
      appnet:
        ipv4_address: 172.28.0.2

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL:-redis://172.28.0.2:6379}
      API_PORT: ${API_PORT:-3000}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${API_PORT:-3000}/health >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s
    networks:
      appnet:
        ipv4_address: 172.28.0.3

networks:
  appnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
